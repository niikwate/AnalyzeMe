<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analyze Me 2.0</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="dashboard-wrapper">
    <!-- Bovenbalk met Titel & API Instellingen -->
    <header class="topbar">
      <div>
        <h1>Analyze Me 2.0</h1>
        <p class="subtitle">Plan, Train & Analyze</p>
      </div>
      <div class="topbar-actions">
        <button type="button" id="openSettingsBtn" class="settings-btn">⚙️ API Koppeling</button>
      </div>
    </header>

    <!-- API Instellingen Balk (verborgen tot je op ⚙️ klikt of als er nog geen key is) -->
    <div id="settingsBar" class="settings-panel" style="display: none;">
      <div class="settings-fields">
        <input type="text" id="athleteIdInput" placeholder="Athlete ID (bijv. i12345 of 0)" />
        <input type="password" id="apiKeyInput" placeholder="Intervals.icu API Key" />
        <button type="button" id="saveSettingsBtn" class="save-btn">Opslaan en gegevens laden</button>
      </div>
      <p class="settings-hint">Je gegevens worden lokaal in je eigen browser (localStorage) bewaard.</p>
    </div>

    <!-- Paneel: Trainingsplanning -->
    <section class="panel">
      <div class="panel-header">
        <div>
          <h2 id="calenderHeading" style="cursor: pointer;" title="Ga naar huidige week">Calender</h2>
          <p class="subtitle">Geplande sessies en voortgang per week</p>
        </div>
        <div class="week-badges">
          <span id="weekTypeBadge" class="date-badge" style="display: none;"></span>
          <span id="dateRangeLabel" class="date-badge"></span>
        </div>
      </div>

      <!-- Navigatie Boven -->
      <div class="week-arrow-container week-arrow-top">
        <button type="button" id="prevWeekBtn" class="week-arrow-btn" title="Vorige week">▲ Vorige week</button>
      </div>

      <!-- 3D Kubus Wrapper -->
      <div class="cube-viewport">
        <div id="cubeAnimator" class="cube-animator">
          <div id="calendarGrid" class="calendar-grid"></div>
        </div>
      </div>

      <!-- Navigatie Onder -->
      <div class="week-arrow-container week-arrow-bottom">
        <button type="button" id="nextWeekBtn" class="week-arrow-btn" title="Volgende week">Volgende week ▼</button>
      </div>

     <!-- Voortgangsbalken -->
      <div class="sport-progress-grid">
        <div class="progress-box">
          <div class="progress-top">
            <span class="progress-title"><span class="progress-dot-blue"></span>Hardlopen</span>
            <span id="runProgressText" class="progress-stats">0u 00m / 0u 00m</span>
          </div>
          <div class="progress-track">
            <div id="runProgressBar" class="progress-fill-run"></div>
          </div>
        </div>

        <div class="progress-box">
          <div class="progress-top">
            <span class="progress-title"><span class="progress-dot-red"></span>Fietsen</span>
            <span id="rideProgressText" class="progress-stats">0u 00m / 0u 00m</span>
          </div>
          <div class="progress-track">
            <div id="rideProgressBar" class="progress-fill-ride"></div>
          </div>
        </div>
      </div>

      <!-- Voortgangsbalken Trainingsload (TSS) -->
      <div class="sport-progress-grid">
        <div class="progress-box">
          <div class="progress-top">
            <span class="progress-title"><span class="progress-dot-blue"></span>Hardlopen load</span>
            <span id="runLoadProgressText" class="progress-stats">0 / 0 TSS</span>
          </div>
          <div class="progress-track">
            <div id="runLoadProgressBar" class="progress-fill-run"></div>
          </div>
        </div>

        <div class="progress-box">
          <div class="progress-top">
            <span class="progress-title"><span class="progress-dot-red"></span>Fietsen load</span>
            <span id="rideLoadProgressText" class="progress-stats">0 / 0 TSS</span>
          </div>
          <div class="progress-track">
            <div id="rideLoadProgressBar" class="progress-fill-ride"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
